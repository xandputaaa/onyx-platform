<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080a0c"><title>ORNI · Blender Workspace</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#080a0c;color:#f1f3f4;font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#screen{position:absolute;inset:0;overflow:hidden;background:#080a0c}#screen canvas{width:100%;height:100%;object-fit:contain}
#status{position:fixed;z-index:5;top:12px;left:14px;padding:7px 11px;border:1px solid #333b43;border-radius:99px;background:#101418dd;color:#c9d0d6;font-size:11px}#studioHint{position:fixed;z-index:5;top:12px;right:14px;padding:7px 11px;border:1px solid #333b43;border-radius:99px;background:#101418dd;color:#c9d0d6;font-size:11px}
#gate{position:fixed;z-index:10;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:#080a0cf2}
.card{width:min(360px,100%);padding:24px;border:1px solid #30363d;border-radius:16px;background:#14181d;box-shadow:0 20px 80px #0008}
h1{font-size:19px;font-weight:550;margin:0 0 6px}.muted{color:#9ca5ae;font-size:12px;margin:0 0 16px}
input{width:100%;padding:12px 13px;border:1px solid #3a424a;border-radius:9px;background:#0a0d10;color:#fff;font:inherit;outline:none}
button{width:100%;margin-top:10px;padding:12px;border:0;border-radius:99px;background:#e8eaec;color:#111;font-weight:650}
#error{min-height:18px;margin-top:10px;color:#e3a5a5;font-size:11px}
</style>
</head>
<body>
<div id="screen"></div><div id="status">BLENDER · CONNECTING</div><div id="studioHint">BUILD CONTROLS · ONYX → ORNI STUDIO</div>
<div id="gate"><form class="card" id="form"><h1>Blender Live Viewer</h1><p class="muted">This page only displays the remote Blender desktop. Garment creation controls are in your ONYX Command Center → ORNI Studio. Enter the existing VNC password once; it is kept only in this browser tab session.</p><input id="password" type="password" autocomplete="current-password" placeholder="VNC password" required><button type="submit">Connect</button><div id="error"></div></form></div>
<script type="module">
import RFB from "./core/rfb.js";
const status=document.getElementById("status"),gate=document.getElementById("gate"),form=document.getElementById("form"),input=document.getElementById("password"),error=document.getElementById("error"),screen=document.getElementById("screen");
let rfb=null,attemptedSaved=false;
function setStatus(value){status.textContent="BLENDER · "+value.toUpperCase();}
function showGate(message=""){gate.style.display="flex";error.textContent=message;input.value="";input.focus();}
function connect(password,remember){
  if(rfb){try{rfb.disconnect()}catch{}}
  const protocol=location.protocol==="https:"?"wss:":"ws:";
  const socket=new URL(protocol+"//"+location.host+"/websockify");
  setStatus("connecting");
  rfb=new RFB(screen,socket.href,{credentials:{password}});
  rfb.scaleViewport=true;rfb.resizeSession=true;
  rfb.addEventListener("connect",()=>{setStatus("connected");gate.style.display="none";if(remember)sessionStorage.setItem("orni_vnc_password",password);});
  rfb.addEventListener("disconnect",event=>{setStatus(event.detail?.clean?"disconnected":"connection lost");});
  rfb.addEventListener("credentialsrequired",()=>{sessionStorage.removeItem("orni_vnc_password");try{rfb.disconnect()}catch{}showGate("Password was rejected. Please enter it again.");});
  rfb.addEventListener("securityfailure",()=>{sessionStorage.removeItem("orni_vnc_password");try{rfb.disconnect()}catch{}setStatus("authentication failed");showGate("VNC authentication failed. Check the password and try again.");});
}
form.addEventListener("submit",event=>{event.preventDefault();const password=input.value;if(!password)return;connect(password,true);setStatus("authenticating");});
const saved=sessionStorage.getItem("orni_vnc_password");
if(saved){attemptedSaved=true;connect(saved,true);}else{showGate();}
</script>
</body>
</html>
