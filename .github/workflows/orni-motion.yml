name: ORNI Motion smoke test
on:
  pull_request:
    paths:
      - 'apps/orni-motion/**'
      - '.github/workflows/orni-motion.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install pillow numpy opencv-python-headless
      - name: Run 9:16 render smoke test
        run: python -m unittest discover -s apps/orni-motion -p 'test_*.py' -v
