name: ORNI Motion smoke test
on:
  push:
    branches:
      - feature/orni-motion-storyboard
  pull_request:
    paths:
      - 'apps/orni-motion/**'
      - 'apps/orni-blender/**'
      - '.github/workflows/orni-motion.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg blender espeak
          python -m pip install --upgrade pip
          pip install pillow numpy opencv-python-headless
      - name: Syntax-check Blender scripts
        run: python -m py_compile apps/orni-blender/automation.py apps/orni-blender/cozo_rig.py apps/orni-blender/cozo_boutique.py apps/orni-blender/test_cozo_scene.py apps/orni-blender/render_cozo_episode.py apps/orni-motion/cozo_postprocess.py
      - name: Render all five COZO reference shots
        env:
          COZO_PREVIEW_DIR: ${{ github.workspace }}/cozo-preview-frames
        run: blender -b --python apps/orni-blender/test_cozo_scene.py
      - name: Upload Blender preview frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cozo-five-shot-preview
          path: cozo-preview-frames/*.png
          if-no-files-found: warn
      - name: Render complete COZO 15-second Blender blockout
        run: blender -b --python apps/orni-blender/render_cozo_episode.py -- "${{ github.workspace }}/cozo-episode-001-blockout.mp4"
      - name: Upload complete COZO MP4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cozo-episode-001-animated-blockout
          path: cozo-episode-001-blockout.mp4
          if-no-files-found: error
          retention-days: 7
      - name: Verify COZO video finishing
        run: python apps/orni-motion/test_cozo_postprocess.py
      - name: Run 9:16 render smoke test
        run: python -m unittest discover -s apps/orni-motion -p 'test_*.py' -v
