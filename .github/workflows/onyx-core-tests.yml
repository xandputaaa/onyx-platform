name: ONYX Core Tests
on:
  push:
    paths:
      - 'apps/onyx-core/**'
      - '.github/workflows/onyx-core-tests.yml'
  pull_request:
    paths:
      - 'apps/onyx-core/**'
      - '.github/workflows/onyx-core-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test ONYX Core
        run: npm test
        working-directory: apps/onyx-core
